<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShinEi’s Capsule</title>
  <meta name="description" content="ShinEi’s crown cap collection">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261020f">
</head>
<body>
  <header class="nav">
    <div class="wrap nav__inner">
      <a class="nav__logo" href="./" aria-label="Home"><img src="assets/logo.png" alt="ShinEi" width="72" height="72"></a>
      <nav class="nav__links" aria-label="Main">
        <a class="nav-item" id="nav-story" href="#">My story</a>
        <a class="nav-item" id="nav-contact" href="#contact">Contact</a>
      </nav>
      <button class="btn-icon nav__menu" id="menu-open" type="button" aria-label="Open menu" aria-haspopup="dialog">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 17C20.5523 17 21 17.4477 21 18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18C3 17.4477 3.44772 17 4 17H20ZM20 11C20.5523 11 21 11.4477 21 12C21 12.5523 20.5523 13 20 13H4C3.44772 13 3 12.5523 3 12C3 11.4477 3.44772 11 4 11H20ZM20 5C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6C3 5.44772 3.44772 5 4 5H20Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero__inner">
        <h1 class="hero__title">ShinEi’s Capsule</h1>
        <div class="stats-wrap">
          <div class="stats">
            <div class="stat"><div class="stat__num" id="stat-days">–</div><div class="stat__label">Days collecting</div></div>
            <div class="stat"><div class="stat__num" id="stat-caps">–</div><div class="stat__label">Crown caps</div></div>
            <div class="stat"><div class="stat__num" id="stat-countries">–</div><div class="stat__label">Countries</div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="listing">
      <div class="wrap listing__inner">
        <div class="searchbar">
          <div class="searchbar__row">
            <label class="field" id="search-field">
              <svg class="field__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
              <input id="q" type="search" placeholder="Search by brand, country, product type, illustration, color" autocomplete="off" aria-label="Search caps">
              <button class="field__clear" id="q-clear" type="button" aria-label="Clear search" hidden>
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
              </button>
            </label>
            <button class="chip-btn" id="filter-open" type="button" aria-label="Filter" aria-haspopup="dialog">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sliders"/></svg>
            </button>
          </div>
          <div class="applied" id="applied" hidden></div>
        </div>

        <div class="results" id="results" aria-live="polite"></div>
        <button class="btn-secondary" id="more" type="button" hidden>Show more</button>
        <p class="end-note" id="end-note" hidden>End of list.</p>
      </div>
    </section>
  </main>

  <footer class="footer" id="contact">
    <div class="wrap footer__inner">
      <div class="footer__brand">
        <img src="assets/logo.png" alt="" width="52" height="52">
        <span id="footer-text">ShinEi’s Capsule | 2026</span>
      </div>
      <div class="footer__links">
        <a id="c-email" href="#">email</a>
        <a id="c-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
        <a id="c-behance" href="#" target="_blank" rel="noopener">Behance</a>
      </div>
    </div>
  </footer>

  <!-- Filter sheet -->
  <div class="overlay" id="filter" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title">
      <div class="sheet__header">
        <span class="sheet__spacer"></span>
        <h2 class="sheet__title" id="filter-title">Filter</h2>
        <button class="btn-ghost-icon" type="button" data-close aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="sheet__body" id="filter-body"></div>
      <div class="sheet__footer">
        <button class="btn-reset" id="filter-reset" type="button" aria-label="Reset filter">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-rotate"/></svg>
        </button>
        <button class="btn-primary" id="filter-apply" type="button">View result</button>
      </div>
    </div>
  </div>

  <!-- Cap detail -->
  <div class="overlay overlay--center" id="detail" hidden>
    <div class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail__card" id="detail-card"></div>
    </div>
    <button class="btn-close-lg" type="button" data-close aria-label="Close">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>

  <!-- Mobile menu -->
  <div class="overlay overlay--bottom" id="menu" hidden>
    <div class="menu" role="dialog" aria-modal="true" aria-label="Menu">
      <nav class="menu__list">
        <a class="nav-item is-active" href="./">Home</a>
        <a class="nav-item" id="menu-story" href="#">My story</a>
        <a class="nav-item" id="menu-contact" href="#contact">Contact</a>
      </nav>
      <button class="menu__close" type="button" data-close>Close</button>
    </div>
  </div>
